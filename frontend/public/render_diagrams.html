<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Render Diagram Skripsi High-Definition</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 40px;
      background-color: #f8fafc;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-width: 1900px;
      min-height: 100vh;
    }
    .diagram-card {
      background: #ffffff;
      padding: 36px 48px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 2px solid #cbd5e1;
      display: inline-block;
      text-align: center;
      margin: auto;
    }
    .header-box {
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 2px solid #e2e8f0;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background-color: #0284c7;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 9999px;
      margin-bottom: 10px;
    }
    .diagram-title {
      font-size: 26px;
      font-weight: 900;
      color: #0f172a;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
    }
    .diagram-subtitle {
      font-size: 15px;
      font-weight: 500;
      color: #475569;
      margin: 0;
    }
    #mermaid-target {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
    }
    /* Global Mermaid High-Resolution Typography & Contrast Overrides */
    svg {
      font-family: 'Segoe UI', sans-serif !important;
    }
    .node text, .label text {
      font-size: 16px !important;
      font-weight: 700 !important;
      fill: #0f172a !important;
    }
    .cluster-label text, .cluster text {
      font-size: 18px !important;
      font-weight: 800 !important;
      fill: #0284c7 !important;
    }
    .edgeLabel text {
      font-size: 14px !important;
      font-weight: 600 !important;
      fill: #334155 !important;
      background: #ffffff !important;
    }
    .node rect, .node circle, .node polygon {
      stroke-width: 2px !important;
      stroke: #334155 !important;
    }
    .edgePath path {
      stroke: #475569 !important;
      stroke-width: 2.2px !important;
    }
    marker {
      fill: #475569 !important;
      stroke: #475569 !important;
    }
  </style>
</head>
<body>
  <div class="diagram-card">
    <div class="header-box">
      <div id="diagram-badge" class="badge">Dokumentasi Skripsi & Tugas Akhir</div>
      <h1 id="diagram-title" class="diagram-title">Diagram Sistem</h1>
      <p id="diagram-subtitle" class="diagram-subtitle">Sistem Informasi Perpustakaan SMA Muhammadiyah 1 Pekalongan</p>
    </div>
    <div id="mermaid-target"></div>
  </div>

  <script>
    const diagrams = {
      // 1. Flowchart ASI Swimlane
      'asi': {
        badge: 'FLOWCHART ASI SWIMLANE 4 JALUR',
        title: 'Aliran Sistem Informasi (ASI) Swimlane 4 Jalur Wewenang',
        sub: 'Pemisahan wewenang antara Siswa/Anggota, Petugas Sirkulasi Loket, Kepala Sekolah/Perpus, dan Payment Gateway QRIS',
        code: `flowchart LR
    subgraph Lane_Siswa ["1. Siswa / Anggota Perpustakaan"]
        S1(["Mulai"]) --> S2["Pilih Buku dari Katalog / Rak"]
        S2 --> S3["Tunjukkan KTA Barcode ke Loket"]
        S3 --> S4["Terima Buku & Informasi Jatuh Tempo"]
        S4 --> S5["Masa Peminjaman Buku (Maks 7 Hari)"]
        S5 --> S6["Serahkan Buku Fisik ke Loket Kembali"]
        S6 --> S7{"Terkena Denda Keterlambatan?"}
        S7 -- "Ya" --> S8["Scan Barcode QRIS lupayyy Konter via HP"]
        S7 -- "Tidak" --> S9(["Selesai"])
        S8 --> S10["Terima Kwitansi Resmi Lunas"]
        S10 --> S9
    end

    subgraph Lane_Petugas ["2. Petugas Sirkulasi Loket"]
        P1["Input Data Pinjam di Sistem Web"]
        P2{"Validasi Kuota < 2 & Stok > 0?"}
        P3[("Potong Stok tb_buku (-1)")]
        P4["Periksa Fisik Buku & Tanggal Kembali"]
        P5[("Kalkulasi Denda via tb_pengaturan")]
        P6["Cetak Struk Kwitansi Denda Loket"]
        P7[("Pulihkan Stok tb_buku (+1)")]
    end

    subgraph Lane_Kepsek ["3. Kepala Sekolah & Kepala Perpus"]
        K1["Supervisi Mutu Sirkulasi & Literasi"]
        K2["Tinjau Laporan Inventaris & Kas Denda"]
        K3["Pengesahan Laporan Bertanda Tangan Sah"]
    end

    subgraph Lane_Gateway ["4. Payment Gateway QRIS"]
        G1["Generate Dynamic Invoice Tagihan"]
        G2["Deteksi Notifikasi Settlement Bank Real-Time"]
        G3[("UPDATE Database: status_denda=Lunas")]
    end

    S3 --> P1
    P1 --> P2
    P2 -- "Ya (Valid)" --> P3
    P3 --> S4
    S6 --> P4
    P4 --> P5
    P5 --> S7
    S8 --> G1
    G1 --> G2
    G2 --> G3
    G3 --> P6
    P6 --> S10
    G3 --> P7
    P3 -.-> K1
    G3 -.-> K2
    K2 --> K3`
      },

      // 2. Activity Flowchart Sirkulasi
      'activity': {
        badge: 'ACTIVITY FLOWCHART END-TO-END',
        title: 'Activity Flowchart Siklus Peminjaman & Pengembalian Buku',
        sub: 'Alur aktivitas logika sistem mulai dari seleksi buku, verifikasi kuota 2 buku, pemotongan stok, denda dinamis, hingga pemulihan stok',
        code: `flowchart TD
    StartPinjam(["Mulai Peminjaman"]) --> PilihBuku["Siswa Memilih Buku di Katalog / Rak"]
    PilihBuku --> CekStok{"Cek Stok Fisik Buku > 0?"}
    
    CekStok -- "Tidak" --> ErrStok["Tampilkan Peringatan: Stok Buku Sedang Kosong"]
    ErrStok --> BatalPinjam(["Transaksi Dibatalkan"])
    
    CekStok -- "Ya" --> CekKuota{"Cek Kuota Siswa < 2 Buku Aktif?"}
    CekKuota -- "Tidak" --> ErrKuota["Tolak: Kuota Maksimal 2 Buku Tercapai"]
    ErrKuota --> BatalPinjam
    
    CekKuota -- "Ya" --> GeneratePJ["Generate Kode Transaksi Otomatis PJxxx"]
    GeneratePJ --> HitungTempo["Hitung Tanggal Jatuh Tempo (Hari Pinjam + 7 Hari)"]
    HitungTempo --> SimpanPinjam[("Simpan Record ke tb_peminjaman")]
    SimpanPinjam --> KurangStok[("Update tb_buku: Kurangi Stok Fisik -1")]
    KurangStok --> MasaPinjam["Buku Dalam Masa Peminjaman Siswa"]
    
    MasaPinjam --> PengembalianBuku["Siswa Menyerahkan Buku ke Loket Pengembalian"]
    PengembalianBuku --> CekTempo{"Tanggal Pengembalian > Tanggal Jatuh Tempo?"}
    
    CekTempo -- "Tidak Terlambat" --> DendaNol["Set Denda = Rp 0 & Status Tanpa Denda"]
    DendaNol --> SimpanKembali
    
    CekTempo -- "Terlambat" --> HitungHari["Hitung Selisih Hari Keterlambatan"]
    HitungHari --> HitungTotal["Total Denda = Selisih Hari x Tarif Dinamis tb_pengaturan"]
    HitungTotal --> MetodeBayar{"Pilih Metode Pembayaran"}
    
    MetodeBayar -- "Tunai Loket" --> BayarTunai["Petugas Terima Uang Tunai di Loket"]
    BayarTunai --> SimpanKembali
    
    MetodeBayar -- "QRIS Digital" --> ScanQRIS["Siswa Scan Barcode QRIS lupayyy Konter via HP"]
    ScanQRIS --> VerifGateway["Sistem Gateway Memverifikasi Lunas Otomatis"]
    VerifGateway --> SimpanKembali
    
    SimpanKembali[("Simpan ke tb_pengembalian")] --> UpdatePinjam[("Update tb_peminjaman: status = Dikembalikan")]
    UpdatePinjam --> TambahStok[("Update tb_buku: Pulihkan Stok Fisik +1")]
    TambahStok --> CetakKwitansi["Cetak Struk Kwitansi Resmi Pelunasan"]
    CetakKwitansi --> SelesaiSirkulasi(["Selesai"])`
      },

      // 3. DFD Level 0 Konteks
      'dfd': {
        badge: 'DATA FLOW DIAGRAM (DFD) LEVEL 0',
        title: 'Diagram Konteks (Context Diagram) Sistem Informasi Perpustakaan',
        sub: 'Batas sistem dan arus pertukaran data antara Sistem Informasi Perpustakaan dengan seluruh entitas luar',
        code: `flowchart LR
    Siswa["👤 Siswa / Anggota"]
    Petugas["👮 Petugas Sirkulasi"]
    KepalaPerpus["👩‍💼 Kepala Perpustakaan"]
    KepalaSekolah["👨‍💼 Kepala Sekolah"]
    PaymentGW["💳 Payment Gateway QRIS"]

    Sistem(("SISTEM INFORMASI PERPUSTAKAAN<br/>SMA MUHAMMADIYAH 1 PEKALONGAN"))

    Siswa -->|"1. Formulir Pendaftaran Siswa<br/>2. Request Pinjam Buku Mandiri<br/>3. Pembayaran Denda QRIS"| Sistem
    Sistem -->|"1. Kartu KTA Digital Barcode<br/>2. Status Pinjaman & Tanggal Tempo<br/>3. Tagihan Denda & Barcode QRIS"| Siswa

    Petugas -->|"1. Pencatatan Sirkulasi Loket<br/>2. Verifikasi Pengembalian Fisik Buku<br/>3. Input Penerimaan Denda Tunai"| Sistem
    Sistem -->|"1. Daftar Antrean Sirkulasi Aktif<br/>2. Cetak Label Barcode Rak Code 128<br/>3. Struk Kwitansi Resmi Denda"| Petugas

    KepalaPerpus -->|"1. Master Koleksi Buku & Rak<br/>2. Konfigurasi Tarif Denda & Staf"| Sistem
    Sistem -->|"1. Statistik Koleksi & Stok Buku<br/>2. Laporan Inventaris Perpustakaan"| KepalaPerpus

    KepalaSekolah -->|"1. Permintaan Filter Periode Audit"| Sistem
    Sistem -->|"1. Rekapitulasi Sirkulasi & Kas Denda<br/>2. Laporan Sah Bertanda Tangan Digital"| KepalaSekolah

    Sistem -->|"1. Request Generate Invoice Tagihan"| PaymentGW
    PaymentGW -->|"1. Notifikasi Callback Settlement Lunas"| Sistem`
      },

      // 4. Use Case Diagram
      'usecase': {
        badge: 'USE CASE DIAGRAM UML',
        title: 'Use Case Diagram UML Sistem Perpustakaan (14 Use Cases)',
        sub: 'Pemetaan 14 use case fungsional ke dalam 4 modul utama dengan kontrol akses berbasis peran (RBAC)',
        code: `flowchart LR
    subgraph Aktor ["Aktor Pengguna"]
        A_Siswa["👤 Siswa / Anggota"]
        A_Petugas["👮 Petugas Sirkulasi"]
        A_Admin["👩‍💼 Kepala Perpustakaan"]
        A_Kepsek["👨‍💼 Kepala Sekolah"]
        A_PG["💳 Payment Gateway Provider"]
    end

    subgraph Use_Cases ["Use Cases Sistem Perpustakaan"]
        UC1(["UC01: Login Multi-Role & Registrasi"])
        UC2(["UC02: Pencarian & Katalog Rak Buku"])
        UC3(["UC03: Peminjaman Mandiri (Maks 2)"])
        UC4(["UC04: Cetak KTA Barcode NISN"])
        UC5(["UC05: Bayar Denda QRIS Digital"])
        UC6(["UC06: Pelayanan Front-Desk Loket"])
        UC7(["UC07: Pengembalian Buku & Cek Fisik"])
        UC8(["UC08: Kalkulasi Denda Keterlambatan"])
        UC9(["UC09: Cetak Kwitansi Denda Resmi"])
        UC10(["UC10: CRUD Master Koleksi Buku"])
        UC11(["UC11: Cetak Barcode Label Rak"])
        UC12(["UC12: Konfigurasi Tarif Denda Global"])
        UC13(["UC13: Manajemen Akun Staf (RBAC)"])
        UC14(["UC14: Audit Mutu & Pengesahan Laporan"])
    end

    A_Siswa --> UC1
    A_Siswa --> UC2
    A_Siswa --> UC3
    A_Siswa --> UC4
    A_Siswa --> UC5

    A_Petugas --> UC1
    A_Petugas --> UC2
    A_Petugas --> UC6
    A_Petugas --> UC7
    A_Petugas --> UC8
    A_Petugas --> UC9
    A_Petugas --> UC11

    A_Admin --> UC1
    A_Admin --> UC2
    A_Admin --> UC10
    A_Admin --> UC11
    A_Admin --> UC12
    A_Admin --> UC13
    A_Admin --> UC14

    A_Kepsek --> UC1
    A_Kepsek --> UC14

    UC7 -.->|"[include]"| UC8
    UC8 -.->|"[extend]"| UC5
    UC8 -.->|"[extend]"| UC9
    A_PG --> UC5`
      },

      // 5. ERD 3NF
      'erd': {
        badge: 'ENTITY RELATIONSHIP DIAGRAM (ERD)',
        title: 'Entity Relationship Diagram (ERD) Normalisasi 3NF',
        sub: 'Skema basis data relasional 6 tabel utama dengan Foreign Key aktif di engine MySQL InnoDB',
        code: `erDiagram
    tb_anggota ||--o{ tb_peminjaman : "memiliki_riwayat (1:N)"
    tb_petugas ||--o{ tb_peminjaman : "mencatat_pinjam (1:N)"
    tb_buku ||--o{ tb_peminjaman : "item_pinjam (1:N)"
    tb_peminjaman ||--o| tb_pengembalian : "diselesaikan_pada (1:1)"
    tb_petugas ||--o{ tb_pengembalian : "menerima_kembali (1:N)"
    tb_petugas ||--o{ tb_pengaturan : "mengonfigurasi (1:N)"

    tb_anggota {
        varchar nisn PK "Nomor Induk Siswa Nasional"
        varchar nama_lengkap "Nama Siswa"
        varchar kelas "Rombongan Belajar"
        mediumtext foto "Foto Profil Siswa"
        enum jenis_kelamin "L / P"
        varchar password "Hash Bcrypt"
    }

    tb_petugas {
        varchar username PK "Username Staf"
        varchar nama_petugas "Nama Lengkap"
        varchar role "admin, petugas2, kepsek"
        varchar jabatan "Jabatan Struktural"
        varchar password "Hash Bcrypt"
    }

    tb_buku {
        varchar kd_buku PK "Kode Koleksi Buku"
        varchar judul_buku "Judul Lengkap"
        varchar pengarang "Penulis"
        varchar penerbit "Penerbit"
        varchar lokasi_rak "Rak A-01, B-01, dll"
        int stok "Stok Fisik Tersedia"
    }

    tb_peminjaman {
        varchar kd_peminjaman PK "Nomor Transaksi PJxxx"
        varchar kd_buku FK "Relasi ke tb_buku"
        varchar nisn FK "Relasi ke tb_anggota"
        date tgl_peminjaman "Tanggal Mulai Pinjam"
        date tgl_jatuh_tempo "Batas Waktu Pinjam"
        enum status "Dipinjam, Dikembalikan, Terlambat"
        int perpanjangan_count "Frekuensi Perpanjang (Maks 1x)"
    }

    tb_pengembalian {
        varchar kd_pengembalian PK "Nomor Pengembalian KBxxx"
        varchar kd_peminjaman FK "Relasi ke tb_peminjaman"
        date tgl_pengembalian "Tanggal Buku Diterima"
        decimal denda "Total Denda Keterlambatan"
        enum status_denda "Lunas, Tertunggak, Tanpa Denda"
        varchar metode_pembayaran "Tunai Loket / QRIS"
        varchar id_transaksi_gateway "ID Transaksi Gateway"
    }

    tb_pengaturan {
        int id PK "Auto Increment"
        varchar kunci UK "tarif_denda, durasi_pinjam, qris"
        text nilai "Nilai Parameter"
        varchar keterangan "Deskripsi Parameter"
    } `
      }
    };

    const params = new URLSearchParams(window.location.search);
    const key = params.get('type') || 'asi';
    const current = diagrams[key] || diagrams['asi'];

    document.getElementById('diagram-badge').innerText = current.badge;
    document.getElementById('diagram-title').innerText = current.title;
    document.getElementById('diagram-subtitle').innerText = current.sub;

    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      themeVariables: {
        fontSize: '16px',
        fontFamily: 'Segoe UI, sans-serif',
        primaryColor: '#e0f2fe',
        primaryTextColor: '#0f172a',
        primaryBorderColor: '#0284c7',
        lineColor: '#475569',
        secondaryColor: '#f1f5f9',
        tertiaryColor: '#ffffff'
      },
      flowchart: {
        curve: 'basis',
        htmlLabels: true,
        nodeSpacing: 50,
        rankSpacing: 60
      },
      securityLevel: 'loose'
    });

    const target = document.getElementById('mermaid-target');
    mermaid.render('renderedDiagram', current.code).then(({ svg }) => {
      target.innerHTML = svg;
      document.body.classList.add('mermaid-ready');
    });
  </script>
</body>
</html>
